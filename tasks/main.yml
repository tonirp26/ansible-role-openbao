---
- name: Ensure required OpenBao dependencies are present.
  ansible.builtin.apt:
    name:
      - gpg
      - ca-certificates
      - python3-debian

- name: Download OpenBao signing key.
  ansible.builtin.get_url:
    url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
    dest: /etc/apt/keyrings/openbao.asc
    owner: root
    group: root
    mode: '0444'
  register: _openbao_signing_key

- name: Add OpenBao repositories.
  ansible.builtin.deb822_repository:
    name: openbao
    types: deb
    uris: https://pkgs.openbao.org/deb
    suites: stable
    components: main
    signed_by: "{{ _openbao_signing_key.dest }}"
    state: present

- name: Ensure OpenBao is present
  ansible.builtin.apt:
    name: "openbao={{ openbao_version }}"
    state: present
    update_cache: true
    # openbao.hcl is a dpkg conffile; keep the Ansible-managed version on upgrades.
    dpkg_options: "force-confold"

- name: Ensure the file audit device log directory exists
  ansible.builtin.file:
    path: "{{ openbao_audit_file_log_path | dirname }}"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
  when:
    - openbao_audit_enabled | bool
    - openbao_audit_file_enabled | bool
    - openbao_audit_file_log_path | dirname != "."
    - openbao_audit_file_log_path not in ["stdout", "discard"]

- name: Deploy OpenBao server configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_file }}"
    owner: "{{ openbao_config_owner }}"
    group: "{{ openbao_config_group }}"
    mode: "{{ openbao_config_mode }}"
    validate: "/usr/bin/bao operator validate-config -config=%s"
  notify: Reload OpenBao
