---
- name: Ensure required OpenBao dependencies are present.
  ansible.builtin.apt:
    name:
      - gpg
      - ca-certificates
      - python3-debian

- name: Download OpenBao signing key.
  ansible.builtin.get_url:
    url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
    dest: /etc/apt/keyrings/openbao.asc
    owner: root
    group: root
    mode: '0444'
  register: _openbao_signing_key

- name: Add OpenBao repositories.
  ansible.builtin.deb822_repository:
    name: openbao
    types: deb
    uris: https://pkgs.openbao.org/deb
    suites: stable
    components: main
    signed_by: "{{ _openbao_signing_key.dest }}"
    state: present

- name: Ensure OpenBao is present
  ansible.builtin.apt:
    name: "openbao={{ openbao_version }}"
    state: present
    update_cache: true
